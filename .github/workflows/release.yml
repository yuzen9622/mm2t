# Builds, signs, notarizes and publishes a release when a vX.Y.Z tag is pushed. The tagged commit
# must be on the `release` branch, and CHANGELOG.md must have a section for the version.
# Without the MACOS_CERTIFICATE_P12_BASE64 secret it publishes an ad-hoc signed, unnotarized DMG
# and no appcast instead. Secrets and one-time setup: docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release by hand: pick the vX.Y.Z tag under "Use workflow from".
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  WORK: ${{ github.workspace }}/.build/release
  DERIVED: ${{ github.workspace }}/.build/xcode-release

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history lets the next step check the tag against the release branch.
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DMG=$WORK/mm2t-$version.dmg" >> "$GITHUB_ENV"
          mkdir -p "$WORK"

      - name: Check the tag is on the release branch
        run: |
          git fetch --no-tags origin release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on the release branch. Merge it into release, then tag from there. See docs/releasing.md."
            exit 1
          fi

      - name: Read this version's changelog section
        run: |
          python3 .github/scripts/changelog.py CHANGELOG.md "$VERSION" > "$WORK/changelog.md" \
            || { echo "::error::CHANGELOG.md has no entries for $VERSION. Move [Unreleased] under a ## [$VERSION] heading before tagging. See docs/releasing.md."; exit 1; }

      - name: Choose signed or unsigned mode
        id: mode
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID secrets found: signed, notarized release with an appcast."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 is not set: publishing an ad-hoc signed, unnotarized DMG without an appcast."
          fi

      - name: Check the Sparkle public key is filled in
        if: steps.mode.outputs.signed == 'true'
        run: |
          key=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" App/Config/Info.plist)
          if [[ $(printf '%s' "$key" | base64 -d 2>/dev/null | wc -c) -ne 32 ]]; then
            echo "::error::SUPublicEDKey in App/Config/Info.plist is still the placeholder. See docs/releasing.md."
            exit 1
          fi

      - name: Import the Developer ID certificate
        if: steps.mode.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 '"Developer ID Application:')
          if [[ -z "$identity" ]]; then
            echo "::error::The .p12 holds no Developer ID Application identity"
            exit 1
          fi
          team=$(sed -E 's/.*\(([A-Z0-9]{10})\)".*/\1/' <<< "$identity")
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          echo "SIGNING_HASH=$(awk '{print $2}' <<< "$identity")" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        if: steps.mode.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Archive
        if: steps.mode.outputs.signed == 'true'
        run: |
          xcodebuild archive \
            -project App/MM2T.xcodeproj -scheme mm2t -configuration Release \
            -derivedDataPath "$DERIVED" -clonedSourcePackagesDirPath "$DERIVED/SourcePackages" \
            -archivePath "$WORK/mm2t.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--options=runtime --timestamp --keychain $KEYCHAIN"

      - name: Export with Developer ID signing
        if: steps.mode.outputs.signed == 'true'
        run: |
          cat > "$WORK/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$WORK/mm2t.xcarchive" \
            -exportPath "$WORK/export" \
            -exportOptionsPlist "$WORK/ExportOptions.plist"
          app="$WORK/export/mm2t.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Sparkle ships its helpers ad-hoc signed; the export must re-sign them or notarization fails.
          sparkle="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          for code in "$app" "$sparkle" "$sparkle/Autoupdate" "$sparkle/Updater.app" "$sparkle"/XPCServices/*.xpc; do
            info=$(codesign -dv --verbose=2 "$code" 2>&1)
            if ! grep -q "TeamIdentifier=$TEAM_ID" <<< "$info" || ! grep -q "(runtime)" <<< "$info" || ! grep -q "^Timestamp=" <<< "$info"; then
              echo "::error::$code is not signed by $TEAM_ID with the hardened runtime and a timestamp"
              echo "$info"
              exit 1
            fi
          done
          shipped=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          if [[ "$shipped" != "$VERSION" ]]; then
            echo "::error::The app says $shipped but the tag says $VERSION"
            exit 1
          fi
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Archive with ad-hoc signing
        if: steps.mode.outputs.signed != 'true'
        run: |
          xcodebuild archive \
            -project App/MM2T.xcodeproj -scheme mm2t -configuration Release \
            -derivedDataPath "$DERIVED" -clonedSourcePackagesDirPath "$DERIVED/SourcePackages" \
            -archivePath "$WORK/mm2t.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          app="$WORK/mm2t.xcarchive/Products/Applications/mm2t.app"
          # Ad-hoc code has no Team ID, so the hardened runtime's library validation makes dyld refuse
          # llama.framework ("different Team IDs"). Re-sign only the app itself with an entitlement that
          # allows ad-hoc frameworks; the frameworks keep the ad-hoc signatures Xcode gave them.
          codesign --display --entitlements - --xml "$app" > "$WORK/entitlements.plist"
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.disable-library-validation bool true" "$WORK/entitlements.plist"
          codesign --force --sign - --options runtime --entitlements "$WORK/entitlements.plist" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          shipped=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          if [[ "$shipped" != "$VERSION" ]]; then
            echo "::error::The app says $shipped but the tag says $VERSION"
            exit 1
          fi
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Notarize and staple the app
        if: steps.mode.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$APP" "$WORK/mm2t.zip"
          .github/scripts/notarize.sh "$WORK/mm2t.zip"
          xcrun stapler staple "$APP"

      - name: Build the DMG
        run: .github/scripts/build_dmg.sh "$APP" "$DMG"

      - name: Sign, notarize and staple the DMG
        if: steps.mode.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          codesign --sign "$SIGNING_HASH" --keychain "$KEYCHAIN" --timestamp "$DMG"
          .github/scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Write release notes
        run: |
          {
            cat "$WORK/changelog.md"
            printf '\n**Full changelog**: https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          } > "$WORK/notes.md"

      - name: Add install instructions for the unsigned app
        if: steps.mode.outputs.signed != 'true'
        run: |
          cat - "$WORK/notes.md" > "$WORK/notes-unsigned.md" <<'EOF'
          > [!IMPORTANT]
          > 這個版本**沒有** Apple Developer ID 簽章，也沒有經過 Apple 公證，第一次打開時 macOS 會擋下來。App 也不會自動檢查更新，新版本請回到 GitHub Releases 下載。

          ## 安裝

          1. 下載 `mm2t-X.Y.Z.dmg`，打開後把 `mm2t.app` 拖到「應用程式」資料夾。
          2. 在「應用程式」資料夾中，按住 Control 鍵點一下 `mm2t.app`（或按右鍵），選擇 **打開**，再在對話框中按 **打開**。
          3. 如果對話框只有「完成」或「移到垃圾桶」，沒有「打開」：先按 **完成**，到 **系統設定 > 隱私權與安全性**，捲到「安全性」區塊，在「已阻擋 mm2t」旁按 **仍要打開**，輸入密碼後再按一次 **打開**。
          4. 以上方法都無效時，打開「終端機」執行下面的指令，移除下載隔離標記後再打開 App：

             ```bash
             xattr -dr com.apple.quarantine /Applications/mm2t.app
             ```

          更新到新版本後，macOS 可能會再次詢問麥克風、系統音訊錄製等權限，這是未簽章 App 的正常現象。

          EOF
          sed -i '' "s/mm2t-X\.Y\.Z\.dmg/mm2t-$VERSION.dmg/" "$WORK/notes-unsigned.md"
          mv "$WORK/notes-unsigned.md" "$WORK/notes.md"

      - name: Update the appcast
        if: steps.mode.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          feed="$WORK/appcast"
          mkdir -p "$feed"
          # The previous release's appcast keeps the older entries; the first release has none.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$feed" || echo "No earlier appcast; starting a new one."
          cp "$DMG" "$feed/"
          cp "$WORK/notes.md" "$feed/mm2t-$VERSION.md"
          bin="$DERIVED/SourcePackages/artifacts/sparkle/Sparkle/bin"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --embed-release-notes \
            --link "https://github.com/$GITHUB_REPOSITORY/releases" \
            "$feed"
          signature=$(python3 .github/scripts/check_appcast.py "$feed/appcast.xml" "$VERSION" "mm2t-$VERSION.dmg")
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$bin/sign_update" --verify "$DMG" "$signature" --ed-key-file -
          echo "APPCAST=$feed/appcast.xml" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The unsigned mode has no appcast.
          assets=("$DMG")
          if [[ -n "${APPCAST:-}" ]]; then assets+=("$APPCAST"); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "mm2t $VERSION" --notes-file "$WORK/notes.md" --verify-tag --latest
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary.p8"

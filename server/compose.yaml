services:
  mm2t-server:
    build: 
      context: .
      network: host
    image: mm2t-server
    restart: unless-stopped
    ports:
      - "${MM2T_PORT:-8000}:${MM2T_PORT:-8000}"
    environment:
      MM2T_DEVICE: cuda
      MM2T_PORT: ${MM2T_PORT:-8000}
      MM2T_COMPUTE_TYPE: float16
      MM2T_SERVER_TOKEN: ${MM2T_SERVER_TOKEN:-}
      MM2T_MAX_UPLOAD_MB: ${MM2T_MAX_UPLOAD_MB:-500}
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"MM2T_PORT\"]}/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
